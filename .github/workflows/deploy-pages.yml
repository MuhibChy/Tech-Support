name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Database Seeders
        run: php artisan db:seed --force

      - name: Generate Static Site (full public export)
        run: php scripts/generate_docs.php

      - name: Verify Static Export
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/robots.txt
          test -f docs/sitemap.xml
          test -f docs/.nojekyll
          test -f docs/services/index.html
          test -f docs/contact/index.html
          test -f docs/pricing/index.html
          test -f docs/login/index.html
          echo "Static export OK:"
          find docs -name index.html | wc -l

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
